name: SIMAK CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Job 1: Backend Testing & Build Verification ─────────────────────────────
  backend-test:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Unit Tests
        working-directory: ./backend
        run: go test -v -race -cover ./internal/simak ./internal/inspection

      - name: Verify Statically Linked Binary Build
        working-directory: ./backend
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null cmd/server/main.go

  # ─── Job 2: Frontend Type Check & Production Bundle ──────────────────────────
  frontend-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Type Check & Build Bundle
        working-directory: ./frontend
        run: npm run build

  # ─── Job 3: Docker Container Build Verification ──────────────────────────────
  docker-validation:
    name: Validate Production Docker Containers
    needs: [ backend-test, frontend-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: simak-backend:latest

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: simak-frontend:latest
