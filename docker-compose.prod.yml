services:
  # ─── PostgreSQL 16 Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: simak_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      POSTGRES_DB: ${POSTGRES_DB:-simak_db}
      TZ: Asia/Jakarta
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simak_user} -d ${POSTGRES_DB:-simak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simak_prod_net

  # ─── Redis 7 Cache & Rate Limiting ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: simak_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simak_prod_net

  # ─── Go Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simak_prod_backend
    restart: always
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-simak_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-simak_password}
      DB_NAME: ${POSTGRES_DB:-simak_db}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-SuperSecretInkaProductionKeyChangeThis2026!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretInkaRefreshKeyChangeThis2026!}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - simak_prod_net

  # ─── Vue 3 Frontend & Nginx Gateway ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simak_prod_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - simak_prod_net

volumes:
  postgres_prod_data:
    name: simak_prod_postgres_data
  redis_prod_data:
    name: simak_prod_redis_data

networks:
  simak_prod_net:
    name: simak_prod_network
    driver: bridge
